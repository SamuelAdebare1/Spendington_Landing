<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Spendington</title>
  <style>
    :root {
      --theme: #0975D9;
      --theme-20: #C8DFF4;
      --error: #d12a2a;
      --text: #1a1a1a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--theme-20);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: var(--theme); }
    p  { margin: 0 0 16px; line-height: 1.45; color: #444; }
    label { display: block; font-size: 14px; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="password"]:focus { border-color: var(--theme); }
    button {
      width: 100%;
      padding: 13px;
      font-size: 16px;
      background: var(--theme);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 14px; }
    .msg.error { color: var(--error); }
    .msg.success { color: #148a3a; }
    .open-app { text-align: center; }
    .open-app a {
      color: var(--theme);
      text-decoration: underline;
      font-size: 14px;
    }
    .hidden { display: none; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div id="openingApp" class="open-app hidden">
      <h1>Opening Spendington…</h1>
      <p>If the app didn't open, <a id="appLink" href="#">tap here</a>, or use the form below.</p>
    </div>

    <div id="formWrap">
      <h1>Reset your password</h1>
      <p id="intro">Enter and confirm your new password.</p>
      <form id="resetForm" autocomplete="on">
        <label for="pw">New password</label>
        <input type="password" id="pw" name="new-password"
               autocomplete="new-password" minlength="6" required />

        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" name="new-password"
               autocomplete="new-password" minlength="6" required />

        <button type="submit" id="submitBtn">Update password</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://fnmunjanuuaiiotrzsri.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZubXVuamFudXVhaWlvdHJ6c3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcyNzkwNzcsImV4cCI6MjA3Mjg1NTA3N30.6xnGUcxa0wenjqodiq5k9FFIWr-Y92x9tmFiKwoVsP0';

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { flowType: 'implicit', detectSessionInUrl: false, persistSession: false }
    });

    // Implicit flow puts tokens in the URL hash, e.g.
    // #access_token=...&refresh_token=...&type=recovery
    const hash = location.hash.startsWith('#') ? location.hash.substring(1) : '';
    const hashParams = new URLSearchParams(hash);
    const accessToken  = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const errorDesc    = hashParams.get('error_description');

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // On mobile, try to hand off to the app with the tokens preserved in the hash.
    if (isMobile && accessToken) {
      const deepLink = `spendington://reset-callback/#${hash}`;
      document.getElementById('openingApp').classList.remove('hidden');
      document.getElementById('appLink').href = deepLink;
      window.location.href = deepLink;
    }

    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    function setMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + (type || '');
    }

    if (errorDesc) {
      setMsg(decodeURIComponent(errorDesc.replace(/\+/g, ' ')), 'error');
      btn.disabled = true;
    } else if (!accessToken || !refreshToken) {
      setMsg('Invalid or missing reset link. Please request a new one from the app.', 'error');
      btn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!accessToken || !refreshToken) return;

      const pw  = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;

      if (pw !== pw2) {
        setMsg('Passwords do not match.', 'error');
        return;
      }
      if (pw.length < 6) {
        setMsg('Password must be at least 6 characters.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Updating…';
      setMsg('', '');

      try {
        const { error: sessErr } = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (sessErr) throw sessErr;

        const { error: updErr } = await sb.auth.updateUser({ password: pw });
        if (updErr) throw updErr;

        await sb.auth.signOut();

        setMsg('Password updated. Open the Spendington app and sign in.', 'success');
        form.reset();
      } catch (err) {
        const m = (err && err.message) || 'Something went wrong. Please request a new reset link.';
        setMsg(m, 'error');
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
